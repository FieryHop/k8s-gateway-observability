apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-web-canary-host
  namespace: platform-demo
spec:
  parentRefs:
    - name: demo-gateway
      sectionName: http
  hostnames:
    - canary.demo.local
  rules:
    - backendRefs:
        - {name: demo-web-canary, port: 80}
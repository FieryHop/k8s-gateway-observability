apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-web-canary-nginx
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
        include /etc/nginx/mime.types;
        server_tokens off;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        log_format json_combined escape=json
            '{"timestamp":"$time_iso8601","request_id":"$request_id",'
            '"remote_addr":"$remote_addr","method":"$request_method",'
            '"uri":"$request_uri","protocol":"$server_protocol",'
            '"status":$status,"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"}';
        access_log /dev/stdout json_combined;
        error_log /dev/stderr warn;
        server {
            listen 8080;
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }
            location / {
                default_type text/plain;
                return 200 "Hello from canary!\n";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web-canary
  labels:
    app.kubernetes.io/name: demo-web-canary
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-web-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-web-canary
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine-slim
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: demo-web-canary-nginx
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-canary
  labels:
    app.kubernetes.io/name: demo-web-canary
spec:
  selector:
    app.kubernetes.io/name: demo-web-canary
  ports:
    - name: http
      port: 80
      targetPort: http
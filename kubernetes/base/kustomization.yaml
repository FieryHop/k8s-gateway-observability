apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-demo

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - canary.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: k8s-observability-demo
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
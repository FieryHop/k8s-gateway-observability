apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    <system>
      log_level info
    </system>

    <source>
      @type tail
      @id in_tail_demo_web
      path /var/log/containers/demo-web-*_platform-demo_nginx-*.log
      exclude_path ["/var/log/containers/*_nginx-exporter-*.log"]
      pos_file /fluentd/pos/demo-web.pos
      tag demo-web.nginx
      read_from_head true
      path_key log_file
      <parse>
        @type multi_format
        <pattern>
          format json
        </pattern>
        <pattern>
          format cri
        </pattern>
      </parse>
    </source>

    <filter demo-web.nginx>
      @type record_transformer
      enable_ruby true
      remove_keys message
      <record>
        log ${record["log"] || record["message"]}
        namespace ${record["log_file"].split("/").last.split("_")[1]}
        pod ${record["log_file"].split("/").last.split("_")[0]}
        container ${record["log_file"].split("/").last.split("_")[2].sub(/-[0-9a-f]{64}\.log\z/, "")}
      </record>
    </filter>

    <filter demo-web.nginx>
      @type parser
      key_name log
      reserve_data true
      remove_key_name_field true
      emit_invalid_record_to_error false
      <parse>
        @type multi_format
        <pattern>
          format json
        </pattern>
        <pattern>
          format none
        </pattern>
      </parse>
    </filter>

    <match demo-web.nginx>
      @type elasticsearch
      host elasticsearch.logging.svc.cluster.local
      port 9200
      scheme http
      logstash_format true
      logstash_prefix demo-web
      suppress_type_name true
      reconnect_on_error true
      reload_on_failure true
      request_timeout 30s
      <buffer>
        @type memory
        flush_mode interval
        flush_interval 2s
        retry_max_interval 30
        chunk_limit_size 2M
      </buffer>
    </match>